name: Clean up old deployments

on:
  push:
    branches: [main]

permissions:
  deployments: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel to register deployment
        run: sleep 20

      - name: Delete old deployments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ids=$(gh api /repos/${{ github.repository }}/deployments \
            --paginate --jq '.[].id' | tail -n +2)

          if [ -z "$ids" ]; then
            echo "No old deployments to clean up."
            exit 0
          fi

          echo "$ids" | while read id; do
            gh api -X POST /repos/${{ github.repository }}/deployments/$id/statuses \
              --field state=inactive --silent
            gh api -X DELETE /repos/${{ github.repository }}/deployments/$id --silent
            echo "Deleted deployment $id"
          done
